# electron-builder configuration (ADR-0001: Electron shell, electron-builder
# producing installers; roadmap item 8).
#
# One `npm run build` (electron-vite → out/) feeds every target, so the bytes
# that get smoke-tested are the bytes that ship:
#   - win nsis  → the SHIP artifact, a Windows Setup.exe
#   - win zip   → wine-free fallback: the same packaged app, just archived
#   - linux dir → the SMOKE target, unpacked so Playwright can launch it under
#                 WSLg without installing anything
#
# CROSS-BUILD REALITY (measured 2026-07-25, correcting ADR-0001's "NSIS
# installers cross-build routinely from Linux/WSL"):
#   Packaging both platforms works natively, and `makensis` itself has a Linux
#   build that electron-builder downloads and runs. But NSIS generates its
#   UNINSTALLER by executing the freshly built installer once — running a
#   Windows .exe — so the nsis target requires **wine** on Linux and fails with
#   `spawn wine ENOENT` without it. `win zip` has no uninstaller and therefore
#   needs no wine, which is why it exists here as the fallback.
#   See ADR-0010 for the decision this forced.
#
# The renderer is fully bundled by vite (three, react, zustand and the 7.6 MB
# occt WASM all land in out/renderer/assets). better-sqlite3 is the exception
# (ADR-0007/0013): a native module cannot be bundled and ships unpacked, which
# is also where cross-building gets harder (see VISION "Target platform vs.
# development platform").
#
# A narrow `files` list does NOT keep node_modules out — electron-builder
# includes production dependencies regardless — which is why the exclusions
# below exist and why they are stated as removals rather than as an allow-list.

appId: com.loganbresnahan.cartonfit
productName: Carton Fit

# Display name has a space; nothing on disk does (ADR-0019). Both of these
# default to productName, so without them every shipped filename would carry it.
executableName: Carton-Fit
artifactName: Carton-Fit-${version}-${os}.${ext}
copyright: Copyright © 2026 Logan Bresnahan

directories:
  buildResources: build
  output: release

# The app icon. electron-builder would find `build/icon.png` by convention, but
# naming it means a rename fails the build instead of silently reverting to the
# stock Electron atom — which looks enough like "an icon" to survive review.
# One 512² PNG is the source for every platform: electron-builder generates the
# Windows .ico (all sizes up to 256) and the Linux icon set from it.
# `build/icon-source.png` is the unprocessed art; see build/ICON.md for what was
# done to it and why.
icon: build/icon.png

# The electron-vite output plus the manifest electron needs to find `main` —
# AND the production dependencies, which electron-builder includes whether or
# not they are listed here. That is what the exclusions below are for.
#
# MEASURED (2026-07-25, roadmap item 9): unpruned, the app carried 12 MB of
# occt-import-js and 28 MB of better-sqlite3, of which 54 KB and 2.2 MB
# respectively are used at runtime. The rest was C++ sources, the sqlite3
# amalgamation, compiler object files, and a SECOND copy of the 7.6 MB OCCT
# wasm.
files:
  - out/**
  - package.json

  # occt-import-js is bundled by vite: the JS glue is inlined into
  # out/renderer/assets/import.worker-*.js and the wasm is emitted as a hashed
  # asset (`?url` in loadOcct.ts), which is the copy the app actually loads and
  # the one asarUnpack exposes for the LGPL relink. The package copy is dead
  # weight — but its LICENCE TEXTS ARE NOT. ADR-0011's notices cite
  # `license.occt.txt` and `license.occt-import-js.txt` by name, so these
  # exclusions name what goes rather than what stays: an over-broad exclude here
  # is a licence violation, not a size win.
  - '!node_modules/occt-import-js/dist/occt-import-js.wasm'
  - '!node_modules/occt-import-js/dist/occt-import-js.js'
  - '!node_modules/occt-import-js/dist/occt-import-js-worker.js'
  - '!node_modules/occt-import-js/{test,tools,examples,occt-import-js}'
  - '!node_modules/occt-import-js/{CMakeLists.txt,start_server.bat}'

  # better-sqlite3 is loaded at runtime from node_modules (main process), so
  # lib/, package.json and build/Release/better_sqlite3.node all stay — as does
  # LICENSE, which THIRD-PARTY-NOTICES.md cites. What goes is everything needed
  # only to BUILD it: the sqlite3 amalgamation, the C++ sources, and the
  # compiler's object files, which alone are 15 MB.
  - '!node_modules/better-sqlite3/{src,deps,docs}'
  - '!node_modules/better-sqlite3/build/{deps,Makefile,binding.Makefile,config.gypi}'
  - '!node_modules/better-sqlite3/build/*.mk'
  - '!node_modules/better-sqlite3/build/Release/{obj,obj.target,.deps}'
  - '!node_modules/better-sqlite3/build/Release/test_extension.node'

  # MSVC's intermediates (roadmap item 14). The rules above name gcc's output —
  # `obj`, `obj.target`, `.deps`, `*.mk` — and simply do not match what the
  # Windows compiler leaves behind, so this survived item 9's pass on the only
  # build anyone installs.
  #
  # MEASURED 2026-07-26 by unpacking the CI artifact for 69aabd8: .iobj 14.0 MiB,
  # sqlite3.lib 6.8 MiB (a build INPUT), .ipdb 3.3 MiB, plus the test extension's
  # own set — 25 MB, none of which any runtime path opens. `better_sqlite3.node`
  # (1.85 MiB) is the only file here that is ever loaded.
  - '!node_modules/better-sqlite3/build/Release/*.{iobj,ipdb,lib,exp}'
  - '!node_modules/better-sqlite3/build/*.vcxproj'
  - '!node_modules/better-sqlite3/build/*.vcxproj.filters'

  # three and react-dom are bundled into out/renderer by vite, so these
  # node_modules copies are unreachable — PROVEN, not assumed: the only bare
  # `require()` anywhere in the shipped `out/` tree is better-sqlite3, plus
  # electron and node builtins.
  #
  # ONLY THE CODE GOES. `LICENSE` and `package.json` stay at each package root,
  # and that is not tidiness — THIRD-PARTY-NOTICES.md says "Each component's
  # full notice ships with it inside the application archive", and these files
  # are what makes that sentence true. The bundled code still ships inside the
  # vite output, so the MIT obligation survives the pruning even though the
  # package does not. Excluding either directory wholesale would leave the app
  # asserting something false about itself — a licence violation, not a size win,
  # which is the same reason the occt exclusions above are written this way.
  - '!node_modules/three/{build,src}'
  - '!node_modules/react-dom/cjs'
  # Fetches prebuilt binaries at INSTALL time; ADR-0013 compiles from source, so
  # it never runs in the packaged app.
  - '!node_modules/prebuild-install'

# Deterministic-ish archives; no auto-update wiring yet (roadmap "Later").
compression: normal

# NATIVE MODULE REBUILD (ADR-0013). Both settings are required; neither alone
# is sufficient, and the failure mode is silent.
#
#   npmRebuild: true              → run @electron/rebuild at package time.
#   buildDependenciesFromSource   → make it COMPILE rather than look for a
#                                   prebuilt binary.
#
# MEASURED: with `npmRebuild: true` alone, @electron/rebuild runs with
# buildFromSource=false, tries to fetch a prebuild for Electron's ABI 148,
# finds none (no npm better-sqlite3 publishes one — that is the whole reason
# for ADR-0013), and then reports "finished" having left the Node-ABI binary
# in place. The packaged app shipped a .node its own runtime could not load —
# byte-identical to the Node build, confirmed by md5 — and nothing failed until
# the app tried to open a database. Compiling takes ~60 s; a silently broken
# installer costs more.
npmRebuild: true
buildDependenciesFromSource: true

# LGPL RELINK SEAM (ADR-0011). occt-import-js is LGPL-2.1, and the LGPL's whole
# point is that a recipient can substitute their own build of the library. The
# .wasm is already a discrete file rather than base64 inlined into a JS bundle
# (`?url` in loadOcct.ts), so keeping it OUT of app.asar makes that substitution
# a plain file copy instead of an archive repack. This is compliance made
# concrete, not a build optimization — don't "tidy" it away.
asarUnpack:
  - out/renderer/assets/*.wasm
  # NATIVE MODULES MUST BE UNPACKED (ADR-0013). A .node is dlopen'd by the OS
  # loader, which cannot read inside an asar archive. electron-builder unpacks
  # them by default — but declaring `asarUnpack` at all REPLACES that default,
  # so adding the wasm glob above silently packed better-sqlite3 back into
  # app.asar. Measured: `asar list` showed
  # /node_modules/better-sqlite3/build/Release/better_sqlite3.node inside the
  # archive. Both entries are load-bearing; neither is redundant.
  - '**/*.node'

# The licence texts ride next to Electron's own LICENSE.electron.txt at the app
# root, where someone looking for them will actually find them.
extraFiles:
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE.carton-fit.txt

win:
  # zip FIRST: it is what a WSL build can actually produce (ADR-0010). nsis is
  # kept configured because CI's windows-latest runner builds it natively, and
  # `electron-builder --win nsis` there needs no extra config.
  target:
    - target: zip
      arch: [x64]
  # Keep executable EDITING (icon, product name, version stamped onto the exe —
  # done natively by electron-builder's app-builder), but skip code SIGNING,
  # which shells out to signtool.exe under wine and is the one step that cannot
  # cross-build from WSL. No certificate exists yet anyway; the consequence is
  # a SmartScreen warning on first run, which the dogfood handoff must state
  # rather than hide.
  signAndEditExecutable: true
  signExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Carton Fit
  artifactName: Carton-Fit-Setup-${version}.${ext}

linux:
  target:
    - target: dir
      arch: [x64]
  category: Utility
  synopsis: Estimate how CAD parts pack into shipping cartons

mac:
  target: dmg
  category: public.app-category.productivity
