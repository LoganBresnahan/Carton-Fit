# Release — build the ship artifacts on their native platform (ADR-0010, ADR-0012).
#
# ADR-0010: the Windows NSIS installer CANNOT be cross-built from Linux (NSIS
# generates its uninstaller by executing the installer, which needs wine), and
# native modules cannot be cross-compiled for Windows at all. So the installer is
# built here, on windows-latest, natively — this workflow owns the ship artifact.
# Confirmed empirically on the first run: Setup.exe + uninstaller, no wine.
#
# The Windows leg does not just BUILD; it verifies itself, because it is the only
# machine that can. It runs the full packaged e2e suite and the ADR-0011
# compliance check on the bytes it just produced.
#
# A `v*` tag additionally attaches the artifacts to a DRAFT GitHub release.
# Nothing is ever published automatically: publishing is a human act after
# dogfooding (ADR-0012), and `workflow_dispatch` skips that job entirely.
#
# Two jobs rather than one `strategy.matrix`: ADR-0012 says "two-leg matrix", but
# the legs are not symmetric — Windows builds two targets and runs two
# verification steps that have no Linux counterpart. Expressing that as a matrix
# means `if: matrix.os == ...` on half the steps, which is harder to read than
# two named jobs. Same platforms, same artifacts; presentation only.

name: Release

on:
  push:
    tags: ['v*']
  # Iteration trigger. release.yml can only really be exercised on a Windows
  # runner, and tagging to test it would either burn version numbers or fail the
  # version gate below. Dispatch builds and verifies; it never publishes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap, fast, and first: refuse to build a mislabeled installer. The job
  # always runs (rather than carrying an `if:` on the job itself) so the build
  # legs can depend on it normally — a skipped dependency would skip them too.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            echo "::error::Bump package.json (or retag) — one honest version per installer."
            exit 1
          fi
      - name: Note (dispatch run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "workflow_dispatch — version gate skipped, nothing will be published."

  windows:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Keyed on package-lock.json automatically. Worst case on a miss is a
          # slower run, never a wrong build.
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      # `--win nsis zip` overrides electron-builder.yml's win.target, which lists
      # only zip. That is deliberate, not an oversight: zip is what a local WSL
      # build can produce, and this runner is the only place nsis can be built.
      # Do not "fix" the yml by adding nsis there — it would break local /deploy.
      #
      # `--publish never`: electron-builder detects CI and silently switches on
      # its own GitHub publisher, which then dies on a missing GH_TOKEN. We do
      # not want its publisher — ADR-0012 puts artifacts on a DRAFT release,
      # created explicitly in phase 3, so a human decides what goes public.
      #
      # Produces: release/*Setup*.exe (ship), release/*-win.zip, release/win-unpacked/.
      - name: Package (nsis + zip)
        run: npx electron-builder --win nsis zip --publish never

      # Instant, so it runs before the slow e2e. `--self-test` first mutates a
      # copy of the binary and requires the checker to notice — a compliance
      # check that cannot fail is worse than no check, and this is the one class
      # of check that stays green while the thing it guards silently rots.
      - name: ASAR integrity must not be enforced (ADR-0011)
        run: node scripts/check-asar-integrity-fuse.mjs --self-test "release/win-unpacked/Packaging Estimator.exe"

      # The whole point of building here (ADR-0012): verify the shipped bytes on
      # the platform that ships them. Windows runners have a real desktop
      # session, so no xvfb — but the SwiftShader flags in e2e/harness.ts still
      # matter, since the runner has no GPU.
      #
      # PACKAGED_APP is set as an env block rather than via the `e2e:packaged`
      # npm script: that script hardcodes a POSIX `VAR=x cmd` prefix AND the
      # linux-unpacked path, neither of which works here. An env block needs no
      # `cross-env` dependency and no second npm script.
      - name: E2E against the packaged Windows build
        run: npx playwright test
        env:
          PACKAGED_APP: release/win-unpacked/Packaging Estimator.exe

      # ADR-0011: prove the LGPL relink guarantee on the platform that ships.
      # This spec deliberately corrupts the unpacked OCCT wasm and requires STEP
      # import to BREAK — a negative result is the only thing that shows the file
      # is load-bearing. It runs from its own config because it must never be
      # part of an ordinary e2e run. It restores the build in afterAll; the
      # installer and zip were produced by the Package step above, before any
      # tampering, so artifacts are unaffected either way.
      - name: LGPL wasm substitution must break the app (ADR-0011)
        run: npx playwright test --config playwright.compliance.config.ts
        env:
          PACKAGED_APP: release/win-unpacked/Packaging Estimator.exe

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # Keyed on package-lock.json automatically. Worst case on a miss is a
          # slower run, never a wrong build.
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      # CLI override again: electron-builder.yml's linux.target is `dir` (the
      # e2e smoke target), not AppImage. AppImage is the distributable form and
      # only CI needs it, so it stays out of the local config.
      #
      # No e2e here — ci.yml already runs the packaged Linux smoke on every
      # push, so repeating it on tag would cost minutes to re-prove a green.
      - name: Package (AppImage)
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  # ADR-0012: releases are DRAFTS. Publishing is a human act, after dogfooding
  # the built installer — the same judgment /deploy step 4 already encodes.
  # Nothing reaches the public because a tag was pushed by mistake.
  #
  # A third job rather than an upload step in each leg: two legs racing to
  # create-or-append the same release is a genuine race, and the whole point of
  # this job is that it happens exactly once, deliberately.
  draft-release:
    needs: [windows, linux]
    # Tags only. workflow_dispatch builds and verifies but never publishes —
    # this `if:` is what makes that true.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job in either workflow that may write to the repo, and it gets
    # that permission here rather than at workflow scope.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find artifacts -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No artifacts were downloaded — nothing to attach."
            exit 1
          fi
          printf 'attaching:\n'; printf '  %s\n' "${FILES[@]}"

          # Notes live in .github/release-notes.md rather than inline: a heredoc
          # inside a YAML block scalar depends on two independent indentation
          # rules agreeing, and gets silently mangled when they don't.
          #
          # Re-running a tag's workflow must not fail on an existing draft.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists — replacing its assets"
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Packaging Estimator $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              "${FILES[@]}"
          fi

          echo "::notice::Draft release $GITHUB_REF_NAME created. It is NOT public — dogfood the installer, then publish it by hand."
